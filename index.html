<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b2a5b" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%230b2a5b' stroke='%23ffc857' stroke-width='3'/%3E%3Cpath d='M16 2V30M2 16H30' stroke='%23ffffff' stroke-width='2'/%3E%3C/svg%3E" />
    <meta name="description" content="A free, open-source territory map for freight and industrial sales reps. Import your accounts, explore nearby facilities, and plan customer visits." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <title>Territory Atlas</title>
  </head>
  <body>
    <!-- Maps raster tile brightness onto blueprint ink: pale land becomes drafting blue (#0b2a5b), dark ink becomes white. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <filter id="bp-tiles" color-interpolation-filters="sRGB">
        <feColorMatrix type="saturate" values="0" />
        <feComponentTransfer>
          <feFuncR type="linear" slope="-1.03" intercept="1" />
          <feFuncG type="linear" slope="-0.9" intercept="1" />
          <feFuncB type="linear" slope="-0.69" intercept="1" />
        </feComponentTransfer>
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
